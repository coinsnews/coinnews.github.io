<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Crypto News Feed &amp; Archive | CrypticPulse</title>
  <meta name="description" content="Explore the full repository of CrypticPulse crypto news, technical analysis, Bitcoin market research, and DeFi security updates.">
  <link rel="canonical" href="https://crypticpulse.github.io/blog/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://crypticpulse.github.io/blog/">
  <meta property="og:title" content="CrypticPulse News Feed &amp; Archive">
  <meta property="og:description" content="All articles, technical reports, and market research from CrypticPulse.">
  <meta property="og:image" content="https://crypticpulse.github.io/images/hero-btc.svg">

  <link rel="stylesheet" href="/css/style.css">

  <!-- Schema.org JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "CrypticPulse Blog Archive",
    "url": "https://crypticpulse.github.io/blog/",
    "description": "Cryptocurrency market archive and intelligence feed."
  }
  </script>
</head>
<body data-page="blog">

  <!-- Modular Header Placeholder -->
  <div id="header-placeholder"></div>

  <main class="container page-main">
    <div class="page-header">
      <h1 class="page-title">Intelligence Archive</h1>
      <p class="page-subtitle">Real-time breaking crypto news, on-chain analytics, and protocol research.</p>
    </div>

    <!-- Category Filter Bar & Live Search -->
    <div class="filter-controls">
      <div class="category-buttons" id="categoryButtons">
        <button class="filter-btn active" data-category="all">All Articles</button>
        <button class="filter-btn" data-category="bitcoin">Bitcoin</button>
        <button class="filter-btn" data-category="ethereum">Ethereum</button>
        <button class="filter-btn" data-category="defi">DeFi</button>
        <button class="filter-btn" data-category="security">Security</button>
        <button class="filter-btn" data-category="regulation">Regulation</button>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search by title, keyword, or topic..." aria-label="Search articles by keywords">
      </div>
    </div>

    <!-- Dynamic Blog Grid Loop (Compact Scannable Feed) -->
    <section class="news-grid-compact" id="blogPostsGrid" aria-label="Article Listing">
      <!-- Dynamically populated from posts.js by main.js -->
      <div class="skeleton-loader card-skeleton"></div>
      <div class="skeleton-loader card-skeleton"></div>
      <div class="skeleton-loader card-skeleton"></div>
    </section>

    <div id="noResults" class="no-results-message" style="display: none;">
      <h3>No matching articles found</h3>
      <p>Try adjusting your search terms or selecting a different category filter.</p>
    </div>
  </main>

  <!-- Modular Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Central Content Repository & Application Logic -->
  <script src="/data/posts.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="regBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b12" />
      <stop offset="100%" stop-color="#2a1420" />
    </linearGradient>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#ff85a1" />
    </linearGradient>
    <filter id="regGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#regBg)" />

  <!-- Pillars of Law & Shield Symbol -->
  <g transform="translate(600, 330)" filter="url(#regGlow)">
    <path d="M0 -120 L100 -50 V60 C100 120, 0 150, 0 150 C0 150, -100 120, -100 60 V-50 Z" fill="none" stroke="url(#regGrad)" stroke-width="6" />
    <path d="M-40 -10 H40 M0 -40 V30" stroke="url(#regGrad)" stroke-width="6" stroke-linecap="round" />
  </g>

  <text x="60" y="90" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="3">GLOBAL CRYPTO REGULATION &amp; ETF POLICY</text>
</svg>

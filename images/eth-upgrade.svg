<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ethBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1320" />
      <stop offset="100%" stop-color="#161f36" />
    </linearGradient>
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="ethGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#ethBg)" />

  <!-- Ethereum Crystal Octahedron Shapes -->
  <g transform="translate(600, 310)" filter="url(#ethGlow)">
    <!-- Top Pyramid -->
    <polygon points="0,-160 -110,0 0,-40" fill="url(#ethGrad)" opacity="0.9" />
    <polygon points="0,-160 110,0 0,-40" fill="url(#ethGrad)" opacity="0.75" />
    <!-- Bottom Pyramid -->
    <polygon points="0,30 -110,0 0,140" fill="url(#ethGrad)" opacity="0.85" />
    <polygon points="0,30 110,0 0,140" fill="url(#ethGrad)" opacity="0.6" />
  </g>

  <!-- Network Circuit Lines -->
  <path d="M100 337 H490 M710 337 H1100" stroke="url(#ethGrad)" stroke-width="3" stroke-dasharray="8 8" />
  
  <text x="60" y="90" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="3">ETHEREUM LAYER-2 SCALING &amp; ROLLUPS</text>
</svg>

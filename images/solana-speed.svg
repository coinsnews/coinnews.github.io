<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="solBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="solGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="solGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#solBg)" />

  <!-- Speed Motion Trails -->
  <g stroke="url(#solGrad)" stroke-width="12" stroke-linecap="round" filter="url(#solGlow)" opacity="0.85">
    <path d="M150 220 L1050 220" stroke-dasharray="140 30" />
    <path d="M100 337 L1100 337" stroke-dasharray="200 40" />
    <path d="M200 454 L1000 454" stroke-dasharray="160 35" />
  </g>

  <text x="60" y="90" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="3">HIGH-THROUGHPUT BLOCKCHAIN ARCHITECTURE</text>
</svg>

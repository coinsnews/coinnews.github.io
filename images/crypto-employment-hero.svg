<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#heroBg)"/>
  
  <path d="M0 135 H1200 M0 270 H1200 M0 405 H1200 M0 540 H1200" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <path d="M300 0 V675 M600 0 V675 M900 0 V675" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Title Card -->
  <rect x="80" y="50" width="1040" height="120" rx="16" fill="rgba(19, 27, 46, 0.9)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="95" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1">THE BARISTA, THE TOBACCO WORKER &amp; THE BLOCKCHAIN ENGINEER</text>
  <text x="600" y="135" text-anchor="middle" fill="#00ff9d" font-family="-apple-system, sans-serif" font-weight="700" font-size="18" letter-spacing="1">CRYPTO QUIETLY OUT-HIRES TWO AMERICAN STAPLES IN 2026</text>

  <!-- 3 Workers Concept Visual Nodes -->
  <!-- 1. Barista (Coffee) -->
  <g transform="translate(250, 380)">
    <rect x="-120" y="-140" width="240" height="280" rx="16" fill="#131b2e" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="0" cy="-40" r="45" fill="#78350f" opacity="0.8"/>
    <!-- Coffee Cup Icon -->
    <path d="M-18 -45 H18 V-25 C18 -15 10 -10 0 -10 C-10 -10 -18 -15 -18 -25 Z" fill="#ffffff"/>
    <path d="M18 -40 H26 C30 -40 30 -30 26 -30 H18" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="40" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="20">Coffee Roasting</text>
    <text x="0" y="70" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="16">28,400 Jobs</text>
  </g>

  <!-- 2. Tobacco Worker -->
  <g transform="translate(600, 380)">
    <rect x="-120" y="-140" width="240" height="280" rx="16" fill="#131b2e" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="0" cy="-40" r="45" fill="#15803d" opacity="0.8"/>
    <!-- Leaf Icon -->
    <path d="M0 -70 C25 -50 25 -20 0 0 C-25 -20 -25 -50 0 -70 Z" fill="#00ff9d"/>
    <text x="0" y="40" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="20">Tobacco Mfg</text>
    <text x="0" y="70" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="16">10,600 Jobs</text>
  </g>

  <!-- 3. Blockchain Engineer (Crypto - Winner) -->
  <g transform="translate(950, 380)" filter="url(#glow)">
    <rect x="-130" y="-150" width="260" height="300" rx="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="3"/>
    <circle cx="0" cy="-45" r="50" fill="url(#purpleGrad)"/>
    <!-- Crypto Hex Node -->
    <polygon points="0,-75 25,-60 25,-30 0,-15 -25,-30 -25,-60" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="0" y="40" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-weight="800" font-size="22">Crypto Industry</text>
    <text x="0" y="75" text-anchor="middle" fill="#00ff9d" font-family="monospace" font-weight="700" font-size="20">34,000 Direct</text>
    <text x="0" y="100" text-anchor="middle" fill="#00f0ff" font-family="sans-serif" font-size="14">232,000 Total Impact</text>
  </g>

  <!-- AI Credit Banner -->
  <rect x="1000" y="615" width="160" height="35" rx="6" fill="rgba(0,0,0,0.7)" stroke="#a855f7" stroke-width="1"/>
  <text x="1080" y="638" text-anchor="middle" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="600">Created by AI</text>
</svg>

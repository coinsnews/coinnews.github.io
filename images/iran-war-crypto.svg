<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#1a0b1c"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="goldBtc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>

    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#627eea"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 135 H1200 M0 270 H1200 M0 405 H1200 M0 540 H1200" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M240 0 V675 M480 0 V675 M720 0 V675 M960 0 V675" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Military Jet Silhouettes (Stylized Geopolitical Theme) -->
  <path d="M150 120 L190 140 L160 145 L170 160 L140 148 L120 155 Z" fill="rgba(255, 77, 109, 0.4)" transform="scale(1.5) translate(-40, 10)"/>
  <path d="M220 90 L260 110 L230 115 L240 130 L210 118 L190 125 Z" fill="rgba(255, 77, 109, 0.25)" transform="scale(1.2) translate(-20, 0)"/>

  <!-- Central Title Banner Overlay -->
  <rect x="100" y="60" width="1000" height="110" rx="12" fill="rgba(19, 27, 46, 0.85)" stroke="rgba(255, 77, 109, 0.4)" stroke-width="2" filter="url(#glowEffect)"/>
  <text x="600" y="105" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="30" letter-spacing="2">BITCOIN &amp; ETHER CAUGHT IN THE CROSSFIRE</text>
  <text x="600" y="145" text-anchor="middle" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="18" letter-spacing="1">HOW THE IRAN WAR IS REWRITING CRYPTO'S RISK PLAYBOOK IN 2026</text>

  <!-- Bitcoin Symbol Left -->
  <g transform="translate(420, 360)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="100" fill="url(#goldBtc)" stroke="#ffffff" stroke-width="4"/>
    <path d="M-20 -45 H25 C45 -45 50 -30 40 -15 C55 0 45 20 20 25 H-20 Z M-5 -30 V-10 H15 C25 -10 25 -30 15 -30 Z M-5 5 V30 H20 C30 30 30 5 15 5 Z M-5 -55 V-45 M15 -55 V-45 M-5 35 V45 M15 35 V45" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ethereum Symbol Right -->
  <g transform="translate(780, 360)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="100" fill="#192338" stroke="#00f0ff" stroke-width="4"/>
    <polygon points="0,-65 50,15 0,40 -50,15" fill="url(#ethGrad)"/>
    <polygon points="0,48 50,22 0,75 -50,22" fill="#00f0ff" opacity="0.8"/>
  </g>

  <!-- Volatility Chart Lines & Tension Overlay -->
  <path d="M 150 520 Q 300 420 450 540 T 750 460 T 1050 580" fill="none" stroke="#ff4d6d" stroke-width="5" filter="url(#glowEffect)"/>
  <path d="M 150 500 Q 350 580 550 440 T 850 510 T 1050 450" fill="none" stroke="#00ff9d" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- AI Badge -->
  <rect x="1000" y="615" width="160" height="35" rx="6" fill="rgba(0,0,0,0.6)" stroke="#00f0ff" stroke-width="1"/>
  <text x="1080" y="638" text-anchor="middle" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="600">Created by AI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="50%" stop-color="#131b2e" />
      <stop offset="100%" stop-color="#192338" />
    </linearGradient>
    <linearGradient id="btcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7931a" />
      <stop offset="100%" stop-color="#ffb74d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bg)" />
  
  <!-- Cyber Grid Lines -->
  <g stroke="rgba(0, 240, 255, 0.08)" stroke-width="1">
    <path d="M0 135 H1200 M0 270 H1200 M0 405 H1200 M0 540 H1200" />
    <path d="M240 0 V675 M480 0 V675 M720 0 V675 M960 0 V675" />
  </g>
  
  <!-- Glowing Data Chart Line -->
  <path d="M50 500 Q 250 450, 450 300 T 850 250 T 1150 120" fill="none" stroke="url(#accentGrad)" stroke-width="5" filter="url(#glow)" />
  <path d="M50 500 Q 250 450, 450 300 T 850 250 T 1150 120 L 1150 675 L 50 675 Z" fill="url(#accentGrad)" opacity="0.06" />

  <!-- Bitcoin Hologram Center Emblem -->
  <g transform="translate(600, 337)" filter="url(#glow)">
    <circle r="120" fill="url(#btcGrad)" opacity="0.15" />
    <circle r="90" fill="none" stroke="url(#btcGrad)" stroke-width="3" stroke-dasharray="10 5" />
    <circle r="75" fill="url(#btcGrad)" />
    <!-- Bitcoin 'B' Symbol -->
    <text x="0" y="26" font-family="-apple-system, sans-serif" font-size="85" font-weight="900" fill="#0b0e17" text-anchor="middle">₿</text>
  </g>

  <!-- Floating Network Nodes -->
  <circle cx="250" cy="450" r="8" fill="#00ff9d" filter="url(#glow)" />
  <circle cx="450" cy="300" r="10" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="850" cy="250" r="9" fill="#00ff9d" filter="url(#glow)" />
  <circle cx="1150" cy="120" r="12" fill="#00f0ff" filter="url(#glow)" />

  <text x="60" y="90" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="3">BITCOIN MARKET CYCLES &amp; HALVING DATA</text>
</svg>

<!-- Global Dynamic Ticker Bar -->
<div class="ticker-bar" aria-label="Live Cryptocurrency Prices">
  <div class="ticker-label">Live Market</div>
  <div class="ticker-wrap">
    <div class="ticker-content" id="tickerContent">
      <!-- Dynamic Ticker Items Populated by JS -->
    </div>
  </div>
</div>

<!-- Header Navigation -->
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="brand-logo" data-route="/" aria-label="CrypticPulse Homepage">
      <svg viewBox="0 0 32 32" fill="none" class="brand-icon">
        <circle cx="16" cy="16" r="14" stroke="#00ff9d" stroke-width="3"/>
        <path d="M10 16L14 20L22 12" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span>Cryptic<span class="pulse">Pulse</span></span>
    </a>

    <nav class="main-nav" id="mainNav" aria-label="Main Navigation">
      <ul class="nav-list">
        <li><a href="/" data-route="/" class="nav-link">Home</a></li>
        <li><a href="/blog/" data-route="/blog/" class="nav-link">News Feed</a></li>
        <li><a href="/about/" data-route="/about/" class="nav-link">About &amp; Mission</a></li>
        <li><a href="/contact/" data-route="/contact/" class="nav-link">Contact</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <!-- Prominent Theme Switcher Toggle -->
      <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Dark and Light Mode">
        <!-- Populated by JS -->
      </button>

      <button class="mobile-nav-toggle" id="mobileNavToggle" aria-expanded="false" aria-label="Toggle Mobile Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

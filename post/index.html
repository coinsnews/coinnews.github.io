<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Clean Blog Route...</title>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get('slug');
      if (slug) {
        window.location.replace('/blog/' + slug + '/');
      } else {
        window.location.replace('/blog/');
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a id="redLink" href="/blog/">Clean Blog Route</a>...</p>
</body>
</html>
